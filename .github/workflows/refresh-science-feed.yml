name: Refresh science feed

# Runs scripts/fetch-science-feed.py twice a day.
# Fetches 35+ California science RSS sources and regenerates
# public/science-feed/index.html as a self-contained static page.

on:
  schedule:
    - cron: '0 7,19 * * *'   # 7 AM and 7 PM UTC (midnight and noon Pacific)
  workflow_dispatch: {}

concurrency:
  group: refresh-science-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetcher
        run: python3 scripts/fetch-science-feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/science-feed/index.html; then
            echo "No changes to science feed — skipping commit."
          else
            git add public/science-feed/index.html
            git commit -m "Science feed: refresh [skip ci]"
            git pull --rebase origin main
            git push
          fi
